<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plink — request USDC with a link. Non-custodial payment links on Arc, the Layer-1 by Circle. Settles in under a second."
    />
    <title>Plink · USDC payment links on Arc</title>

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plink" />
    <meta property="og:title" content="Plink · Get paid in USDC with a link" />
    <meta
      property="og:description"
      content="Non-custodial payment links on Arc, the Layer-1 by Circle. Set an amount, share a link, get paid — final in under a second."
    />
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plink · Get paid in USDC with a link" />
    <meta
      name="twitter:description"
      content="Non-custodial USDC payment links on Arc. Settles in under a second."
    />
    <meta name="twitter:image" content="/og.svg" />
    <meta name="theme-color" content="#05060a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply saved theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("plink-theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          var root = document.documentElement;
          root.classList.toggle("light", t === "light");
          root.classList.toggle("dark", t === "dark");
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
